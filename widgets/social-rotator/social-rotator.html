<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tiklinux — Social Rotator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;font-family:'Cairo',sans-serif}
#screen{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.platform{display:flex;align-items:center;gap:14px;opacity:0;position:absolute}
.platform.show{opacity:1}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#111;flex-shrink:0}
.icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.1)}
.icon img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column}
.platform-name{font-weight:800;color:#fff}
.username{font-size:14px;color:rgba(255,255,255,.85);direction:ltr}
.followers{font-size:12px;color:rgba(255,255,255,.6)}

/* animations */
.a-slide{animation:slide .4s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.a-bounce{animation:bounce .5s ease}
@keyframes bounce{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.a-zoomIn{animation:zoomIn .4s ease}
@keyframes zoomIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.a-flip{animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.a-glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(224,37,25,.6))}50%{filter:drop-shadow(0 0 18px rgba(224,37,25,.9))}}
</style>
</head>
<body>
<div id="screen"></div>
<script>
const QS = new URLSearchParams(window.location.search);
const settings = {
  design: QS.get('design') || 'gradient',
  animation: QS.get('animation') || 'slide',
  layout: QS.get('layout') || 'horizontal',
  bg: QS.get('bg') || 'blur',
  duration: Math.max(1, parseInt(QS.get('duration')) || 3),
  border: QS.get('border') || '#E02519',
  fontSize: parseInt(QS.get('fontSize')) || 16,
  opacity: parseInt(QS.get('opacity')) || 100,
  animSpeed: parseFloat(QS.get('animSpeed')) || 1,
  features: {showAvatar:true,showUsername:true,showPlatform:true,showFollowers:false}
};
try{ if(QS.get('features')) Object.assign(settings.features, JSON.parse(QS.get('features'))); }catch(e){}

let platforms = [];
const screen = document.getElementById('screen');

const BGS = {
  blur: 'radial-gradient(circle at 50% 50%, rgba(0,0,0,.1), rgba(20,20,20,.5))',
  solid: 'linear-gradient(135deg,#0a0a0a,#1a1a1a)',
  gradient: 'linear-gradient(135deg,#1a0533,#0d1a4a,#0a2a1a)',
  glass: 'linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.06))',
  aurora: 'linear-gradient(135deg,#0a2a1a,#1a0533,#0d1a4a)',
  sunset: 'linear-gradient(135deg,#2a1a0a,#1a0a2a)',
  ocean: 'linear-gradient(135deg,#0a1a2a,#0a2a2a)',
  fire: 'linear-gradient(135deg,#2a0a0a,#1a1a0a)',
  matrix: 'linear-gradient(135deg,#000a00,#001a00)',
  galaxy: 'linear-gradient(135deg,#0a002a,#2a001a,#001a2a)',
  candy: 'linear-gradient(135deg,#2a0a2a,#0a2a2a)',
  none: 'linear-gradient(135deg,#000,#111)'
};
if(settings.bg !== 'none') screen.style.background = BGS[settings.bg] || BGS.blur;
screen.style.opacity = (settings.opacity/100);

const PLATFORM_ICONS = {
  ig:'fa-instagram', tk:'', yt:'fa-youtube', fb:'fa-facebook', tw:'fa-twitter',
  sc:'fa-snapchat', twitch:'fa-twitch', discord:'fa-discord', linkedin:'fa-linkedin',
  pinterest:'fa-pinterest', reddit:'fa-reddit', telegram:'fa-telegram', whatsapp:'fa-whatsapp', kick:'fa-kick'
};
const PLATFORM_COLORS = {
  ig:'#E1306C', tk:'#00F2EA', yt:'#FF0000', fb:'#1877F2', tw:'#1DA1F2', sc:'#FFFC00',
  twitch:'#9146FF', discord:'#5865F2', linkedin:'#0A66C2', pinterest:'#E60023',
  reddit:'#FF4500', telegram:'#0088cc', whatsapp:'#25D366', kick:'#53FC18'
};

async function loadPlatforms(){
  try{
    const r = await fetch('/api/social-rotator/settings');
    const d = await r.json();
    if(d.platforms){
      platforms = Object.entries(d.platforms)
        .filter(([,p]) => p && p.enabled && p.username)
        .map(([id,p]) => ({id, username:p.username}));
    }
  }catch(e){}
  if(platforms.length) startRotation(); else screen.innerHTML = '<div style="font-size:14px;color:rgba(255,255,255,.4);font-weight:600">No platforms enabled</div>';
}

function buildCard(p){
  const vertical = settings.layout === 'vertical';
  const icon = PLATFORM_ICONS[p.id];
  const color = PLATFORM_COLORS[p.id] || '#fff';
  return `<div class="platform ${vertical?'vertical':''}" style="flex-direction:${vertical?'column':'row'};font-size:${settings.fontSize}px">
    ${settings.features.showAvatar?`<img class="avatar" src="https://unavatar.io/${p.id}/${encodeURIComponent(p.username)}" onerror="this.style.visibility='hidden'">`:''}
    <div class="info" style="text-align:${vertical?'center':'right'}">
      ${settings.features.showPlatform?`<div class="platform-name" style="color:${color}">${p.id.toUpperCase()}</div>`:''}
      ${settings.features.showUsername?`<div class="username" style="border:2px solid ${settings.border};padding:6px 14px;border-radius:${settings.design==='glow'?'100px':'12px'};box-shadow:${settings.design==='neon'?('0 0 12px '+settings.border):'none'}">${p.username}</div>`:''}
    </div>
  </div>`;
}

let idx = 0;
function show(i){
  screen.innerHTML = buildCard(platforms[i]);
  const card = screen.querySelector('.platform');
  card.style.animationDuration = (settings.animSpeed || 1) + 's';
  card.classList.add('show', 'a-' + (['bounce','bounceIn'].includes(settings.animation)?'bounce':['zoomIn','zoomOut'].includes(settings.animation)?'zoomIn':['flip','flipX'].includes(settings.animation)?'flip':['glow','neonFlicker'].includes(settings.animation)?'glow':'slide'));
}

function startRotation(){
  if(platforms.length === 0) return;
  show(0);
  idx = 1;
  setInterval(()=>{ show(idx % platforms.length); idx++; }, settings.duration * 1000);
}

loadPlatforms();
</script>
</body>
</html>
