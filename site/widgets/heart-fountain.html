<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<link rel="icon" href="/assets/img/tikoverlay-mark.png?v=20260802" type="image/png">

<style>

body {
  margin:0;
  overflow:hidden;
  background:transparent;
}

#app {

  position:absolute;

  bottom:0;
  left:0;

  width:100%;
  height:100%;

  pointer-events:none;

}

.heart-container {

  position:absolute;

  bottom:-10px; /* يبدأ تحت الشاشة */

  transform:translateX(-50%) translateY(0);

  animation-name:floatUp;

  animation-timing-function:cubic-bezier(0.22, 0.61, 0.36, 1);

  animation-fill-mode:forwards;

  opacity:0;

  will-change: transform, opacity;

}



.heart {

  width:var(--size);
  height:var(--size);

  background: var(--color);

  position:relative;

  -webkit-mask: url("data:image/svg+xml,%3csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3e%3cpath fill='white' d='M47.6 300.4L228.3 469.1c7.5 7 17.4 10.9 27.7 10.9s20.2-3.9 27.7-10.9L464.4 300.4c30.4-28.3 47.6-68 47.6-109.5v-5.8c0-69.9-50.5-129.5-119.4-141C347 36.5 300.6 51.4 268 84L256 96 244 84c-32.6-32.6-79-47.5-124.6-39.9C50.5 55.6 0 115.2 0 185.1v5.8c0 41.5 17.2 81.2 47.6 109.5z'/%3e%3c/svg%3e") center/contain no-repeat;

  filter: 
    drop-shadow(0 0 8px var(--color))
    drop-shadow(0 0 15px var(--color))
    drop-shadow(0 2px 4px rgba(0,0,0,0.3));

  animation: heartPulse 0.8s ease-in-out;

}

@keyframes heartPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.avatar {

  width:100%;
  height:100%;

  object-fit:cover;

  position:absolute;
  z-index: 101;
  top:0;
  left:0;

}

/* تأثيرات الجزيئات المتلألئة */
.heart-container::before,
.heart-container::after {
  content: '';
  position: absolute;
  width: 4px;
  height: 4px;
  background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  animation: sparkle 1.5s ease-out infinite;
}

.heart-container::before {
  left: -10px;
  top: 20%;
  animation-delay: 0.3s;
}

.heart-container::after {
  right: -10px;
  top: 40%;
  animation-delay: 0.6s;
}

@keyframes sparkle {
  0%, 100% { 
    opacity: 0; 
    transform: scale(0) translateY(0);
  }
  20% { 
    opacity: 1; 
    transform: scale(1) translateY(-5px);
  }
  80% { 
    opacity: 1; 
    transform: scale(1) translateY(-15px);
  }
}


@keyframes floatUp {

  0% {

    transform:
      translateX(-50%)
      translateY(0)
      scale(0.7)
      rotate(0deg);

    opacity:0;
    filter: blur(2px) brightness(0.8);

  }

  10% {

    opacity:1;
    filter: blur(0px) brightness(1.2);

  }

  50% {
    filter: blur(0px) brightness(1);
  }

  90% {
    filter: blur(1px) brightness(0.9);
  }

  100% {

    transform:
      translateX(calc(-50% + var(--target-x)))
      translateY(var(--target-y))
      scale(1)
      rotate(var(--rotation, 0deg));

    opacity:0;
    filter: blur(3px) brightness(0.6);

  }

}


</style>

</head>

<body>

<div id="app"></div>

<script src="/assets/b/8c386c8dbec5a57f.js"></script>
<script src="/assets/b/f5b4b64a5dacae03.js"></script>
<script src="/assets/b/28b98888f9aaae4a.js"></script>
<script src="/assets/b/bf43dcb5768d07d0.js"></script>

</body>

</html>
