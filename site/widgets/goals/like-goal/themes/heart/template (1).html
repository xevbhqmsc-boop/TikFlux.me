<div id="like-goal-theme-root" class="like-goal-theme-panel is-active" data-theme="heart">
  <div class="scene">
    <div class="goal-wrap">
      <div class="heart-container" id="heartContainer">
        <svg class="liquid-svg" width="420" height="420" viewBox="0 0 420 420">
          <defs>
            <mask id="heartLiquidMask">
              <image
                href="/widgets/goals/like-goal/themes/heart/assets/heart_mask.png"
                x="0"
                y="0"
                width="420"
                height="420"
                preserveAspectRatio="xMidYMid meet"
              />
            </mask>
            <filter id="heartGlow" x="-150%" y="-150%" width="400%" height="400%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur1"/>
              <feFlood flood-color="var(--glow-color-1, #ff0000)" flood-opacity="0.8"/>
              <feComposite in2="blur1" operator="in" result="glow1"/>
              <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur2"/>
              <feFlood flood-color="var(--glow-color-2, #ff3333)" flood-opacity="0.9"/>
              <feComposite in2="blur2" operator="in" result="glow2"/>
              <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur3"/>
              <feFlood flood-color="var(--glow-color-3, #ff6666)" flood-opacity="1"/>
              <feComposite in2="blur3" operator="in" result="glow3"/>
              <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur4"/>
              <feFlood flood-color="var(--glow-color-4, #ffaaaa)" flood-opacity="1"/>
              <feComposite in2="blur4" operator="in" result="glow4"/>
              <feMerge>
                <feMergeNode in="glow1"/>
                <feMergeNode in="glow2"/>
                <feMergeNode in="glow3"/>
                <feMergeNode in="glow4"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="liquidGlowPremium" x="-75%" y="-75%" width="250%" height="250%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="blur1"/>
              <feFlood flood-color="var(--liquid-glow-1, #ff0000)" flood-opacity="0.5" result="color1"/>
              <feComposite in="color1" in2="blur1" operator="in" result="glow1"/>
              <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur2"/>
              <feFlood flood-color="var(--liquid-glow-2, #ff0000)" flood-opacity="0.68" result="color2"/>
              <feComposite in="color2" in2="blur2" operator="in" result="glow2"/>
              <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur3"/>
              <feFlood flood-color="var(--liquid-glow-3, #ff0000)" flood-opacity="0.88" result="color3"/>
              <feComposite in="color3" in2="blur3" operator="in" result="glow3"/>
              <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur4"/>
              <feFlood flood-color="var(--liquid-glow-4, #ff0000)" flood-opacity="1" result="color4"/>
              <feComposite in="color4" in2="blur4" operator="in" result="glow4"/>
              <feMerge>
                <feMergeNode in="glow1"/>
                <feMergeNode in="glow2"/>
                <feMergeNode in="glow3"/>
                <feMergeNode in="glow4"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color: var(--wave-stop-1, #5a0000);" />
              <stop offset="50%" style="stop-color: var(--wave-stop-2, #af0000);" />
              <stop offset="100%" style="stop-color: var(--wave-stop-3, #ff0000);" />
            </linearGradient>
          </defs>
          <g filter="url(#liquidGlowPremium)">
            <path id="waveBack" mask="url(#heartLiquidMask)"></path>
            <g id="bubbles" mask="url(#heartLiquidMask)"></g>
            <path id="waveFront" mask="url(#heartLiquidMask)"></path>
          </g>
        </svg>
        <img src="/widgets/goals/like-goal/themes/heart/assets/heart_shape.webp" alt="" class="heart-shape" decoding="async" fetchpriority="high" width="900" height="900" />
        <div class="goal-center-text">
          <div class="goal-percent" id="goalPercentText">0%</div>
        </div>
      </div>
      <div class="goal-label">Like Goal</div>
      <div class="goal-value" id="goalValueText">0 / 100</div>
    </div>
  </div>
</div>
