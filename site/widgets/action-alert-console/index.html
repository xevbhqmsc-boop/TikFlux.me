<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تنبيهات الإجراءات - TikFlux</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #071426; overflow: hidden; font-family: 'Tajawal', 'Cairo', sans-serif; color: #eaf6ff; }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 18px; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-radius: 16px; background: linear-gradient(120deg, rgba(0,174,255,.18), rgba(0,90,180,.08)); border: 1px solid rgba(0,174,255,.35); }
  h1 { font-size: 20px; color: #00aeff; text-shadow: 0 0 14px rgba(0,174,255,.4); }
  .state { font-size: 13px; color: rgba(255,255,255,.6); }
  .state b { color: #00aeff; }
  .table { flex: 1; overflow: auto; border-radius: 16px; border: 1px solid rgba(0,174,255,.22); background: rgba(255,255,255,.03); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px 14px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.06); }
  th { position: sticky; top: 0; background: rgba(0,174,255,.14); color: #9fdcff; font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  .empty { padding: 40px 20px; text-align: center; color: rgba(255,255,255,.5); }
  .label { display: inline-block; padding: 3px 10px; border-radius: 999px; background: rgba(0,174,255,.16); color: #00aeff; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>لوحة تنبيهات الإجراءات</h1>
    <div class="state" id="state">الحالة: <b>جاري الاتصال...</b></div>
  </header>
  <div class="table" id="table">
    <table>
      <thead><tr><th>الوقت</th><th>المستخدم</th><th>الحدث</th><th>التفاصيل</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">لا توجد تنبيهات بعد</td></tr></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var uid = params.get('uid') || '';
  var preview = params.get('preview') === '1';
  var rows = document.getElementById('rows');
  var state = document.getElementById('state');
  var items = [];
  var MAX = 60;

  var LABELS = {
    gift: 'هدية', follow: 'متابعة', like: 'لايك', share: 'مشاركة', subscribe: 'اشتراك',
    join: 'انضمام', chat: 'تعليق', member_join_overlay_update: 'انضمام',
    gift_overlay_update: 'هدية', follow_overlay_update: 'متابعة',
    subscribe_overlay_update: 'اشتراك', latest_event_update: 'حدث'
  };
  var EVENT_KEYS = {
    gift: 'gift', like: 'like', follow: 'follow', share: 'share', subscribe: 'subscribe',
    join: 'join', chat: 'chat', comment: 'chat', member_join: 'join'
  };

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    if (!items.length) {
      rows.innerHTML = '<tr><td colspan="4" class="empty">لا توجد تنبيهات بعد</td></tr>';
      return;
    }
    rows.innerHTML = items.map(function (row) {
      return '<tr><td>' + esc(row.time) + '</td><td>' + esc(row.name || '—') + '</td><td><span class="label">' + esc(row.label) + '</span></td><td>' + esc(row.detail) + '</td></tr>';
    }).join('');
  }

  var KNOWN = { gift: 1, like: 1, follow: 1, share: 1, subscribe: 1, join: 1, chat: 1,
    member_join_overlay_update: 1, gift_overlay_update: 1, follow_overlay_update: 1,
    subscribe_overlay_update: 1, latest_event_update: 1 };

  function add(type, data) {
    if (!data) return;
    var event = data.event || data;
    var eventType = data.eventType || event.eventType || '';
    var key = EVENT_KEYS[type] || EVENT_KEYS[eventType] || (KNOWN[type] ? type : '');
    if (!KNOWN[key]) return;
    if (key === 'latest_event_update' && eventType) key = EVENT_KEYS[eventType] || key;
    if (!KNOWN[key]) return;
    var user = data.user || event.user || event;
    var name = user.nickname || user.uniqueId || user.username || event.username || '';
    var detail = '';
    if (key === 'gift') {
      var gift = data.gift || event.gift || {};
      detail = (gift.name || gift.giftName || event.giftName || 'هدية') + (gift.diamondCount ? ' · ' + gift.diamondCount + ' عملة' : '');
    } else if (key === 'like') detail = (data.likeCount || event.likeCount || 1) + ' لايك';
    else if (key === 'chat') detail = data.comment || data.message || event.comment || event.message || '';
    else if (key === 'share') detail = 'شارك البث';
    else if (key === 'subscribe') detail = 'اشتراك في القناة';
    items.unshift({
      time: new Date().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' }),
      name: name,
      label: LABELS[key] || 'إجراء',
      detail: detail
    });
    items = items.slice(0, MAX);
    render();
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var ws;
    try { ws = new WebSocket(proto + location.host + '/ws'); } catch (e) {
      state.innerHTML = 'الحالة: <b>تعذّر الاتصال</b>';
      return;
    }
    ws.onopen = function () {
      state.innerHTML = 'الحالة: <b>متصل</b>';
      ws.send(JSON.stringify({ type: 'subscribe', streamerId: uid, clientType: 'action-console' }));
    };
    ws.onmessage = function (msg) {
      var packet;
      try { packet = JSON.parse(msg.data); } catch (e) { return; }
      if (packet.type === 'pong' || packet.type === 'connected' || packet.type === 'subscribed') return;
      add(packet.type, packet.data || packet);
    };
    ws.onclose = function () {
      state.innerHTML = 'الحالة: <b>جاري إعادة الاتصال...</b>';
      setTimeout(connect, 3000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  if (preview) {
    add('gift', { user: { nickname: 'مستخدم تجريبي' }, gift: { name: 'وردة', diamondCount: 1 } });
    add('follow', { user: { nickname: 'متابع تجريبي' } });
  }
  connect();
})();
</script>
</body>
</html>
