<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/img/tikflux-mark.png?v=20260802" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <title>Viewers · TikFlux</title>
  <style>
    :root {
      --red: #ff1a1a;
      --red-bright: #ff4444;
      --red-soft: #ff6b6b;
      --red-glow: rgba(255, 26, 26, 0.55);
      --red-dim: rgba(196, 40, 58, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: transparent;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 22px;
      padding: 22px 36px 22px 24px;
      min-width: 280px;
      border-radius: 20px;
      background: linear-gradient(
        155deg,
        rgba(22, 8, 10, 0.96) 0%,
        rgba(10, 6, 8, 0.98) 50%,
        rgba(18, 6, 8, 0.97) 100%
      );
      border: 1.5px solid rgba(255, 60, 60, 0.28);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.55) inset,
        0 1px 0 rgba(255, 100, 100, 0.1) inset,
        0 16px 48px rgba(0, 0, 0, 0.6),
        0 0 50px var(--red-dim),
        0 0 80px rgba(139, 21, 40, 0.2);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .badge::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      height: 2px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, transparent, rgba(255, 80, 80, 0.7), transparent);
      pointer-events: none;
    }

    .badge::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse 80% 60% at 0% 50%, rgba(255, 40, 40, 0.08), transparent 55%);
      pointer-events: none;
    }

    .badge__icon {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 16px;
      flex-shrink: 0;
      background: linear-gradient(145deg, rgba(255, 40, 40, 0.28) 0%, rgba(139, 21, 40, 0.22) 100%);
      border: 1.5px solid rgba(255, 80, 80, 0.35);
      box-shadow:
        0 0 28px rgba(255, 26, 26, 0.25),
        inset 0 1px 0 rgba(255, 120, 120, 0.15);
      color: var(--red-bright);
    }

    .badge__icon svg {
      width: 36px;
      height: 36px;
      display: block;
      filter: drop-shadow(0 0 8px var(--red-glow));
    }

    .badge__body {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      text-align: center;
    }

    .badge__label-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .badge__dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px var(--red-glow), 0 0 24px rgba(255, 26, 26, 0.4);
      animation: livePulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px var(--red-glow), 0 0 24px rgba(255, 26, 26, 0.4); }
      50% { opacity: 0.65; transform: scale(0.9); box-shadow: 0 0 6px var(--red-glow), 0 0 12px rgba(255, 26, 26, 0.25); }
    }

    .badge__label {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 200, 200, 0.75);
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .badge__count {
      display: block;
      width: 100%;
      font-size: 3.25rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.03em;
      text-align: center;
      text-shadow:
        0 2px 0 rgba(80, 0, 0, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.6),
        0 0 32px var(--red-glow),
        0 0 60px rgba(196, 40, 58, 0.35);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .badge__count.tick {
      animation: countPop 0.55s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    @keyframes countPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); color: var(--red-soft); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge" role="status" aria-live="polite">
      <div class="badge__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" opacity="0.9"/>
        </svg>
      </div>
      <div class="badge__body">
        <div class="badge__label-row">
          <span class="badge__dot" aria-hidden="true"></span>
          <span class="badge__label">Viewers</span>
        </div>
        <span class="badge__count" id="countEl">—</span>
      </div>
    </div>
  </div>

  <script src="/assets/b/8c386c8dbec5a57f.js"></script>
  <script src="/assets/b/28b98888f9aaae4a.js"></script>
  <script src="/assets/b/88e080ffec13f4da.js"></script>
</body>
</html>
